<svg width="820" height="248" viewBox="0 0 820 248" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .title{font-size:20px;font-weight:700;fill:#1A5B7A;}
      .sub{font-size:12.5px;fill:#5d6b75;}
      .eyebrow{font-size:11px;font-weight:700;fill:#E8743B;letter-spacing:.18em;}
      .pill{font-size:12.5px;fill:#1A5B7A;font-weight:600;}
      .focusk{font-size:11px;font-weight:700;fill:#5d6b75;letter-spacing:.1em;}
    </style>
  </defs>
  <rect x="1" y="1" width="818" height="246" rx="10" fill="#ffffff" stroke="#d9dee2" stroke-width="1.5"/>
  <rect x="1" y="1" width="6" height="246" rx="3" fill="#E8743B"/>

  <text x="34" y="42" class="eyebrow">CURRENT FOCUS</text>
  <text x="34" y="70" class="title">Building AI-native security systems</text>
  <text x="34" y="92" class="sub">From research to working prototype — LLMs, RAG and defence tooling.</text>
  <line x1="34" y1="110" x2="786" y2="110" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Odak alanları: pill'ler -->
  <text x="34" y="140" class="focusk">RESEARCH</text>
  <g>
    <rect x="120" y="128" width="88" height="20" rx="10" fill="#eef4f7" stroke="#cfe0e8"/>
    <text x="164" y="142" text-anchor="middle" class="pill">LLM + RAG</text>
    <rect x="218" y="128" width="128" height="20" rx="10" fill="#eef4f7" stroke="#cfe0e8"/>
    <text x="282" y="142" text-anchor="middle" class="pill">Deepfake Defence</text>
    <rect x="356" y="128" width="150" height="20" rx="10" fill="#eef4f7" stroke="#cfe0e8"/>
    <text x="431" y="142" text-anchor="middle" class="pill">Memory Algorithms</text>
  </g>

  <text x="34" y="176" class="focusk">SECURITY</text>
  <g>
    <rect x="120" y="164" width="64" height="20" rx="10" fill="#eef4f7" stroke="#cfe0e8"/>
    <text x="152" y="178" text-anchor="middle" class="pill">SIEM</text>
    <rect x="194" y="164" width="150" height="20" rx="10" fill="#eef4f7" stroke="#cfe0e8"/>
    <text x="269" y="178" text-anchor="middle" class="pill">Threat Intelligence</text>
    <rect x="354" y="164" width="130" height="20" rx="10" fill="#eef4f7" stroke="#cfe0e8"/>
    <text x="419" y="178" text-anchor="middle" class="pill">MITRE ATT&amp;CK</text>
    <rect x="494" y="164" width="132" height="20" rx="10" fill="#eef4f7" stroke="#cfe0e8"/>
    <text x="560" y="178" text-anchor="middle" class="pill">Malware Analysis</text>
  </g>

  <text x="34" y="212" class="focusk">BUILDING</text>
  <g>
    <rect x="120" y="200" width="78" height="20" rx="10" fill="#fdf0e8" stroke="#f3cbb0"/>
    <text x="159" y="214" text-anchor="middle" class="pill" fill="#c85a20">Python</text>
    <rect x="208" y="200" width="54" height="20" rx="10" fill="#fdf0e8" stroke="#f3cbb0"/>
    <text x="235" y="214" text-anchor="middle" class="pill" fill="#c85a20">Go</text>
    <rect x="272" y="200" width="60" height="20" rx="10" fill="#fdf0e8" stroke="#f3cbb0"/>
    <text x="302" y="214" text-anchor="middle" class="pill" fill="#c85a20">Rust</text>
    <rect x="342" y="200" width="88" height="20" rx="10" fill="#fdf0e8" stroke="#f3cbb0"/>
    <text x="386" y="214" text-anchor="middle" class="pill" fill="#c85a20">FastAPI</text>
    <rect x="440" y="200" width="120" height="20" rx="10" fill="#fdf0e8" stroke="#f3cbb0"/>
    <text x="500" y="214" text-anchor="middle" class="pill" fill="#c85a20">Elasticsearch</text>
  </g>
